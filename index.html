<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ACM RecSys ’25, Prague, Czech Republic</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <!-- Bootstrap FIRST -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Your site CSS AFTER Bootstrap so it can override -->
    <link rel="stylesheet" href="assets/css/main.css" />

    <style>
      :root { --box-max: 1000px; }

      .section-box {
        max-width: var(--box-max);
        margin-inline: auto;
        padding: clamp(12px, 2vw, 30px);
        background-color: rgb(254, 248, 248);
      }
      .section-box--plain {
        background: transparent;
      }
	  

      /* Headings scale nicely on small screens */
      h2 { font-size: clamp(1.4rem, 3.8vw, 2rem); color: rgb(15, 89, 89); }
      h3 { font-size: clamp(1.1rem, 3.4vw, 1.75rem); }
      h4 { font-size: clamp(0.95rem, 2.6vw, 1.125rem); }

      /* Avoid overflows */
      h2, h3, h4 { word-break: break-word; }

      /* Optional: soften paragraph width for readability */
      .prose { max-width: 70ch; margin-inline: auto; text-align: justify; }

      /* Remove old fixed widths */
      .box1, .box { width: 100%; max-width: var(--box-max); margin-inline: auto; }

      /* Author cards are centered and responsive */
      

      /* Space between sections */
      .spacer { height: clamp(8px, 2vw, 20px); }
    </style>
  </head>

  <body>
    <div id="page-wrapper">
      <!-- Navbar -->
      <nav class="navbar navbar-expand-md bg-light sticky-top border-bottom mx-auto">
        <div class="container">
          <a class="navbar-brand fw-semibold" href="index.html"></a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#topnav"
                  aria-controls="topnav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>

          <div class="collapse navbar-collapse" id="topnav">
            <ul class="navbar-nav mx-auto">
              <li class="nav-item"><a class="nav-link fw-bold text-dark" href="index.html">Home</a></li>
              <li class="nav-item"><a class="nav-link fw-bold text-dark" href="#" data-load="results.html">About Us</a></li>
              <li class="nav-item"><a class="nav-link fw-bold text-dark" href="#" data-load="hyperparameters.html">Services</a></li>
              <li class="nav-item"><a class="nav-link fw-bold text-dark" href="#" data-load="hyperparameters.html">Completed Projects</a></li>
              <li class="nav-item"><a class="nav-link fw-bold text-dark" href="#" data-load="hyperparameters.html">Contact</a></li>
              <li class="nav-item"><a class="nav-link fw-bold text-dark" href="#" data-load="hyperparameters.html">Privacy Policy</a></li>
              
            </ul>
          </div> 
        </div>
      </nav>

      <!-- Header text -->
      <header class="container text-center my-4">
        <h2 class="mb-2">Electrical Maintaince Company</h2>
        
        
      </header>

      <!-- Abstract-ish box -->
      

      <!-- Dynamic content target -->
      <section class="container my-4">
        <div id="table-placeholder" class="section-box section-box--plain"></div>
      </section>
    </div>

    <!-- JS -->
    <script>
      // Solidify the page title on mobile (and guard against template scripts setting it to "undefined")
      document.addEventListener('DOMContentLoaded', function () {
        if (!document.title || document.title.toLowerCase() === 'undefined') {
          document.title = "ACM RecSys ’25, Prague, Czech Republic";
        }
      });

      // AJAX loader for secondary pages + make any tables responsive
      document.addEventListener('DOMContentLoaded', () => {
        const container = document.getElementById('table-placeholder');

        document.querySelectorAll('a[data-load]').forEach(link => {
          link.addEventListener('click', async (ev) => {
            ev.preventDefault();
            const file = link.getAttribute('data-load');
            try {
              container.innerHTML = '<div class="text-center py-4">Loading…</div>';
              const res = await fetch(file, { cache: 'no-store' });
              const html = await res.text();
              container.innerHTML = html;

              // Style any tables inside loaded HTML
              container.querySelectorAll('table').forEach(tb => {
                tb.classList.add('table', 'table-striped', 'table-sm');
                // Wrap to enable horizontal scroll on small screens
                const wrapper = document.createElement('div');
                wrapper.className = 'table-responsive';
                tb.parentNode.insertBefore(wrapper, tb);
                wrapper.appendChild(tb);
              });

              // Smooth scroll to content on mobile
              container.scrollIntoView({ behavior: 'smooth', block: 'start' });
            } catch (e) {
              container.innerHTML = '<div class="alert alert-danger">Error loading content.</div>';
              console.error(e);
            }
          });
        });
      });
    </script>

    <!-- Bootstrap JS (navbar toggler, etc.) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- (Optional) Remove legacy template JS that may override styles/title:
         assets/js/jquery.min.js, jquery.dropotron.min.js, browser.min.js, breakpoints.min.js, util.js, main.js
         If you keep them, ensure none rewrite document.title or nav behavior. -->
  </body>
</html>
